# Builds the six release artifacts and, for a tag, publishes them to a GitHub Release.
#
#   macOS Intel          tui-wave-<ver>-x86_64-apple-darwin.tar.gz
#   macOS Apple Silicon  tui-wave-<ver>-aarch64-apple-darwin.tar.gz
#   Windows x64          tui-wave-<ver>-x86_64-pc-windows-msvc.zip
#   Debian/Ubuntu        tui-wave_<ver>_amd64.deb
#   Fedora/RHEL/SUSE     tui-wave-<ver>-1.x86_64.rpm
#   Every release        setup-environment.sh (standalone, and inside each package)
#
# No AppImage: it is a single self-contained file with no room for the praatAudioTools scripts
# or a setup script, and tui-wave without its Praat and CDP integrations is not worth shipping.
#
# **The Windows archive is the one that carries the scripts.** Every other artifact ships the
# binary alone and leaves setup-environment.sh to clone praatAudioTools at the pinned commit,
# because that script is bash and Windows has no bash. Rather than port 511 lines of it, the zip
# bundles the submodule beside the executable, where `config::default_praat_audiotools_dir`
# already finds it by walking up from the binary. That needs no code and makes the commit pin
# structurally correct — the scripts *are* the ones the catalog was generated from, rather than
# ones a script was trusted to check out. Only the Python venv still needs a setup step there,
# which setup-python.ps1 covers on its own.
#
# Triggered by a `v*` tag, or by hand from the Actions tab (`workflow_dispatch`) — the manual
# run builds and uploads artifacts but publishes no Release, which is what makes it safe to use
# for testing this workflow itself.
#
# **No test gate.** `cargo test` is expected to have been run locally before tagging; see
# `MANUAL_TESTING.md`. Note also that the two most valuable suites here — the Praat and CDP
# catalog sweeps — are env-gated and need external binaries no runner has, so a CI test step
# would cover strictly less than it appears to.
#
# **The catalog is built as committed.** `praat_catalog.toml` is `include_str!`d into the
# binary and generated from the `praat-audiotools` submodule, so the checkout below pins that
# submodule and nothing regenerates it: a release must be reproducible from its tag, and the
# committed catalog is the one that was actually run against Praat. See update-praat-scripts.sh.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only what the release job needs. The build jobs get the default read-only token.
permissions:
  contents: read

# Action versions are pinned to the lowest major that runs on Node.js 24: GitHub's runners now
# force Node 20 actions onto Node 24 and warn, and will eventually stop. checkout moved at v5,
# upload-artifact at v6. download-artifact is v8 (its v4-v7 are Node 20) and reads anything
# uploaded by upload-artifact v4 or newer, so the pair below is compatible despite the version
# gap. Deliberately not the newest major of each: checkout v7 adds fork-PR restrictions this
# workflow has no use for, and a bigger jump is a bigger surface for a surprise.

env:
  CARGO_TERM_COLOR: always
  # A release build that fails is worth more than a fast one that hides why.
  RUST_BACKTRACE: 1

jobs:
  # ---- macOS: two separate binaries, not a universal one -----------------------------------
  #
  # Deliberately two artifacts rather than one `lipo`'d universal binary. A universal build
  # doubles the download for everyone to spare the minority on the other architecture a choice
  # they only have to make once, and this binary carries a ~70k-line catalog, so it is not small
  # to begin with. `macos-15` is arm64 and `macos-15-intel` is x86_64; each builds natively, so
  # neither is cross-compiled and both are exercised by their own runner.
  macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing should not cancel the other — they fail for different reasons.
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - label: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing: praat_catalog.toml is include_str!'d from third_party/praat-audiotools,
          # so without the submodule the build fails outright rather than degrading.
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # CoreAudio is part of the system, so unlike Linux there is nothing to install for cpal.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          staging="tui-wave-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/tui-wave" "$staging/"
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md \
             install.sh setup-environment.sh "$staging/"
          # Reproducible-ish: sort entries and zero the mtimes, so rebuilding the same tag
          # produces the same tarball rather than one differing only by timestamps.
          tar --format=ustar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  # ---- Windows: one zip, and it carries the scripts -----------------------------------------
  #
  # `windows-latest` is x86_64 and builds natively for `x86_64-pc-windows-msvc`, the default
  # toolchain there — no `--target` needed, so the binary lands in the ordinary `target/release`.
  # Nothing to install: cpal uses WASAPI, which is part of the system, so there is no equivalent
  # of the Linux job's ALSA step.
  #
  # Deliberately x64 only. `windows-11-arm` runners exist, but Windows on ARM runs x64 binaries
  # under emulation and this is a terminal app whose cost is a one-time waveform scan — the
  # second artifact would buy very little for a second way to break the release.
  windows:
    name: Windows x64
    runs-on: windows-latest
    # Windows must never hold up a macOS or Linux release: those are the platforms this is built
    # for, and the zip is a convenience. A job that fails with this flag still counts as
    # satisfied for `needs`, so `release` proceeds either way — but it does still *wait*, which
    # is the point: dropping this job from `needs` entirely would let publishing start before the
    # zip exists (Windows takes ~5m against macOS's ~3m), so the artifact would go missing from
    # most releases rather than only from broken ones.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Doubly load-bearing here. praat_catalog.toml is include_str!'d from this submodule
          # (so the build fails outright without it, as everywhere else), *and* the archive
          # below ships the checkout itself.
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked

      # Proves the MSVC build links and actually starts — the same thing the Linux job's
      # install-and-run check proves for the .deb, and worth more here than anywhere else
      # because this is the only target whose C dependency (mp3lame-sys, which compiles LAME)
      # has never been built on this platform. `--version` exits without needing a TTY (see
      # `parse_args`), so it is safe on a runner.
      - name: Verify the binary runs
        run: .\target\release\tui-wave.exe --version

      # setup-python.ps1 ships in the archive but nothing here runs it — installing numpy and
      # scipy to prove a setup script parses would cost minutes per release. Parsing it is the
      # part that can be checked for free, and is the failure that would otherwise reach a user
      # as a wall of red on first run. It is also the only thing in this repository that cannot
      # be checked at all from the machine it is written on, which is a Linux one.
      - name: Check setup-python.ps1 parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path setup-python.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw "setup-python.ps1 has parse errors" }
          Write-Host "setup-python.ps1 parses cleanly"

      # PowerShell rather than bash: `shell: pwsh` is the runner's default on Windows, and
      # Compress-Archive/Get-FileHash need no extra tooling.
      #
      # The bundled checkout drops two things. `.git` is a submodule gitlink pointing back into
      # the parent repository's modules directory and means nothing outside it. `Max-MSP` is
      # 7.2 MB of Max/MSP patches this app never reads — a third of the submodule, for a host
      # program that has nothing to do with tui-wave. `validate_audiotools_dir` looks only for
      # `Distortion/` and `Reverb/`, which is what makes dropping it safe; see
      # `a_bundled_checkout_beside_the_executable_validates`.
      - name: Package
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $staging = "tui-wave-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item target\release\tui-wave.exe $staging\
          Copy-Item README.md,CHANGELOG.md,LICENSE,THIRD_PARTY_NOTICES.md,setup-python.ps1 $staging\

          # Beside the executable, exactly where the executable-relative walk looks.
          $scripts = Join-Path $staging "third_party\praat-audiotools"
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          Copy-Item "third_party\praat-audiotools\*" $scripts -Recurse -Exclude ".git"
          Remove-Item (Join-Path $scripts "Max-MSP") -Recurse -Force -ErrorAction SilentlyContinue

          # The bundle is the whole point of this artifact, so a silently empty one must fail
          # the build rather than ship as a binary that reports its scripts missing.
          foreach ($sentinel in "Distortion","Reverb") {
            if (-not (Test-Path (Join-Path $scripts $sentinel))) {
              throw "bundled checkout is missing $sentinel/ — was the submodule initialised?"
            }
          }

          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" |
            Out-File -Encoding ascii "$staging.zip.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

  # ---- Linux: one build, three packages ----------------------------------------------------
  #
  # All three Linux formats come from a single `cargo build --release`, because they differ only
  # in how the same binary is wrapped. Building it three times would treble the runner minutes
  # and, worse, allow the three packages to contain different binaries.
  #
  # `ubuntu-22.04` rather than `ubuntu-latest` on purpose: a binary linked against glibc 2.35
  # runs on anything newer, while one built on 24.04's glibc 2.39 refuses to start on 22.04 with
  # a bare "version `GLIBC_2.39' not found". The oldest supported runner is the widest audience.
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cpal links ALSA on Linux and will not build without its development headers — the single
      # most common first failure for an audio crate in CI.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config

      - name: Install packagers
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build
        run: cargo build --release --locked

      - name: Read version
        id: version
        run: echo "value=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Both packagers read their [package.metadata.*] tables from Cargo.toml — see the comments
      # there for what goes in each package and why ALSA is auto-resolved for deb but named
      # explicitly for rpm. `--no-build` on both: they must wrap the binary built above, not
      # trigger a second build with different flags.
      - name: Build .deb
        run: cargo deb --no-build --output "tui-wave_${{ steps.version.outputs.value }}_amd64.deb"

      # Actually install the package and run the binary, on **both** distribution generations.
      #
      # Grepping the `Depends:` field was the first version of this step and was worthless: the
      # dependency string is now hardcoded in Cargo.toml, so any check that it *contains*
      # "libasound" passes by construction and tests nothing.
      #
      # Two generations because ALSA was renamed in the 64-bit time_t transition and the two
      # halves of `libasound2t64 | libasound2` can only be exercised separately: 22.04 has no
      # `libasound2t64` and resolves the fallback, 24.04 has no real `libasound2` and resolves
      # the first alternative. A package that installs on one and not the other looks completely
      # healthy from the other side, which is exactly how this would ship broken.
      #
      # `--version` exits immediately and needs no TTY (see `parse_args`), so it is safe to run
      # in CI while still proving the dynamic linker found libasound at run time — the failure
      # an unsatisfied dependency actually produces.
      - name: Verify the .deb installs and runs (22.04 and 24.04)
        run: |
          set -euo pipefail
          deb="tui-wave_${{ steps.version.outputs.value }}_amd64.deb"
          echo "Depends: $(dpkg-deb -f "$deb" Depends)"

          # The host runner is 22.04 — the `libasound2` fallback branch.
          sudo apt-get install -y "./$deb"
          tui-wave --version
          sudo apt-get remove -y tui-wave

          # A container for 24.04 — the `libasound2t64` branch. `-e DEBIAN_FRONTEND` keeps
          # apt from stopping on a tzdata prompt in a bare image.
          docker run --rm -v "$PWD:/w" -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y --no-install-recommends "/w/'"$deb"'"
              tui-wave --version
            '

      - name: Build .rpm
        run: |
          cargo generate-rpm
          mv target/generate-rpm/*.rpm .

      - name: Checksums
        run: |
          for f in *.deb *.rpm; do
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.sha256
            # Attached to the release standalone as well as installed by the packages, which
            # bury it under /usr/share — no help to someone deciding whether to install at all.
            setup-environment.sh
          if-no-files-found: error

  # ---- Publish -----------------------------------------------------------------------------
  #
  # Tag pushes only. A `workflow_dispatch` run stops after the build jobs, so the workflow can
  # be exercised from a branch without creating a Release — which matters, because a CI workflow
  # essentially never works on the first attempt.
  release:
    name: Publish release
    # `windows` is here only so publishing waits long enough to pick its zip up; it cannot block
    # the release, because that job carries `continue-on-error` — see the comment there. A
    # Windows failure therefore publishes the other five artifacts and `download-artifact` with
    # `merge-multiple` simply finds one fewer directory.
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Drafted rather than published outright: the artifacts are worth downloading and
          # actually running once before anyone else gets them, and a Release is much harder to
          # retract than to finish writing.
          draft: true
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/biomassa/tui-wave/blob/master/CHANGELOG.md).

            **Praat and CDP are installed separately** and are not bundled in any of these
            packages — tui-wave shells out to them and reports what is missing at run time.
            `install.sh` sets both up; the Linux packages carry only the editor.

            The **Windows zip** is the exception in one respect: it bundles the praatAudioTools
            *scripts* beside the executable, so no setup step is needed to reach the Praat
            processes. Praat itself is still a separate install, and `setup-python.ps1` in the
            archive sets up the Python environment the `py` process group needs.

            Verify a download with the matching `.sha256` file.
