# The Airwindows C++ lives in its own crate so that bumping this package's version does not
# recompile ~1040 translation units. See crates/airwindows-sys/Cargo.toml for the full reason.
[workspace]
members = ["crates/airwindows-sys"]
# So a bare `cargo build`/`cargo test` still covers both crates. Without this, cargo operates on
# the root package alone and the sys crate's tests -- including the whole-catalog smoke test that
# instantiates and renders all 500 plugins -- silently stop running.
default-members = [".", "crates/airwindows-sys"]

[package]
name = "tui-wave"
version = "2.10.0"
edition = "2024"
license = "MIT"
# Below this line: metadata the packagers read. `cargo-deb` and `cargo-generate-rpm` both
# require `description` and `license`, and put `homepage`/`repository` in the package header —
# a .deb or .rpm without them installs fine but tells the user nothing about what it is.
description = "Keyboard-driven terminal waveform editor with 500 built-in Airwindows effects, plus CDP and Praat integration"
homepage = "https://github.com/biomassa/tui-wave"
repository = "https://github.com/biomassa/tui-wave"
readme = "README.md"
categories = ["multimedia::audio", "command-line-utilities"]
keywords = ["audio", "waveform", "editor", "tui", "wav"]

[dependencies]
color-eyre = "0.6.5"
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
flacenc = { version = "0.5", default-features = false }
font8x8 = { version = "0.3.1", default-features = false }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false }
mp3lame-encoder = "0.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rodio = "0.22.2"
serde = { version = "1.0.228", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "aiff"] }
toml = "1.1.2"
# The Airwindows effects. A path dependency rather than code in this crate, so a version bump
# here leaves its compiled archive alone -- see that crate's manifest.
airwindows-sys = { path = "crates/airwindows-sys" }

# ---- Packaging ---------------------------------------------------------------------------
#
# Three Linux package formats, all built by .github/workflows/release.yml. None of them can
# bundle the two things tui-wave shells out to — Praat and the CDP binaries — because the user
# installs those separately and points the app at them; a package that claimed to include them
# would be lying. They ship the editor, and the app reports what is missing at run time.

# cargo-deb. `depends` is resolved from the binary's own ELF needs by `$auto`, which picks up
# libasound2 (via cpal) with the right versioned constraint for whatever runner built it —
# hardcoding a version would either over-constrain older Debians or under-constrain newer ones.
[package.metadata.deb]
section = "sound"
priority = "optional"
maintainer = "biomassa <kustota@gmail.com>"
copyright = "2026 biomassa, MIT licensed"
# Written out rather than left to `$auto`, because ALSA was renamed in the 64-bit time_t
# transition and `$auto` cannot span the rename.
#
# `dpkg-shlibdeps` resolves against the *build host*: on ubuntu-22.04 it emits
# `libasound2 (>= 1.0.16)`. But on Ubuntu 24.04+/Debian 13 the package is `libasound2t64`,
# which declares **no** `Provides: libasound2` — there, `libasound2` is a virtual package
# provided only by `liboss4-salsa-asound2`, an OSS compatibility shim. So a `$auto` package
# built on 22.04 is either uninstallable on 24.04 (a versioned dependency cannot be satisfied
# by an unversioned `Provides`) or satisfied by the wrong library entirely.
#
# The alternation fixes both directions: apt takes the first *installable* alternative, so
# 24.04+ gets `libasound2t64` and 22.04/Debian 12 falls through to `libasound2`. One package
# covers both generations.
#
# The other two are the whole rest of the binary's `ldd` output (libc, libm, libgcc, ld — all
# base-system); the floors match ubuntu-22.04, which is what the release workflow builds on and
# the oldest glibc the binary is expected to run against.
depends = "libasound2t64 | libasound2 (>= 1.0.16), libc6 (>= 2.35), libgcc-s1 (>= 3.0), libstdc++6 (>= 12)"
# Praat is packaged by Debian, Ubuntu and Fedora alike, and roughly a third of this app's
# processes need it. `Suggests` rather than `Recommends`: the editor is fully usable without it,
# and a Recommends would install ~40 MB by default for a feature many users never open. CDP is
# not packaged by any distribution and so cannot be named here at all — README.md covers it.
suggests = "praat"
extended-description = """\
A keyboard-driven waveform editor that runs in the terminal: zoomable navigation, playback, \
cut/copy/paste with undo, markers, multichannel support, and WAV/FLAC/AIFF import. Optionally \
drives CDP (Composer's Desktop Project) and Praat/praatAudioTools processes, which are \
installed separately."""
assets = [
    ["target/release/tui-wave", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tui-wave/README.md", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/tui-wave/THIRD_PARTY_NOTICES.md", "644"],
    ["setup-environment.sh", "usr/share/tui-wave/setup-environment.sh", "755"],
    ["packaging/tui-wave.desktop", "usr/share/applications/tui-wave.desktop", "644"],
    ["icon.png", "usr/share/icons/hicolor/256x256/apps/tui-wave.png", "644"],
]

# cargo-generate-rpm. Unlike cargo-deb this does *not* auto-resolve dependencies from the
# binary, so ALSA is named explicitly — `alsa-lib` is the runtime package on Fedora/RHEL and
# openSUSE alike (`alsa-lib-devel` is the build-time one install.sh asks for).
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tui-wave", dest = "/usr/bin/tui-wave", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/tui-wave/README.md", mode = "644" },
    { source = "THIRD_PARTY_NOTICES.md", dest = "/usr/share/doc/tui-wave/THIRD_PARTY_NOTICES.md", mode = "644" },
    { source = "setup-environment.sh", dest = "/usr/share/tui-wave/setup-environment.sh", mode = "755" },
    { source = "packaging/tui-wave.desktop", dest = "/usr/share/applications/tui-wave.desktop", mode = "644" },
    { source = "icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/tui-wave.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
# The Airwindows backend is C++ (see build.rs), so the binary now needs the C++ runtime.
# cargo-deb's `$auto` picks this up from the ELF needs on that side; cargo-generate-rpm
# resolves nothing by itself, so an omission here would produce a package that installs
# cleanly and then fails to start.
"libstdc++" = "*"

# See the `suggests` note on the deb above. Fedora ships Praat as `praat` too.
[package.metadata.generate-rpm.recommends]
praat = "*"

