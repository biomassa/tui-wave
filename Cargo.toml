[package]
name = "tui-wave"
version = "2.5.1"
edition = "2024"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
flacenc = { version = "0.5", default-features = false }
font8x8 = { version = "0.3.1", default-features = false }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false }
mp3lame-encoder = "0.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rodio = "0.22.2"
serde = { version = "1.0.228", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "aiff"] }
toml = "1.1.2"
